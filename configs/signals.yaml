# Signal registry configuration.
#
# Populated by scripts/run_harness.py (Phase 02). A signal is eligible for
# fusion only when its `status` is keep or bench. `kill` is enforced in code
# and in tests: a killed signal can never contribute features.
#
#   status: keep       -> always fused
#   status: bench      -> fused only when applicable and quality-gated
#   status: kill       -> excluded from fusion entirely
#   status: unmeasured -> never fused (the starting state for every signal)
#
# The harness owns `status`. Do not hand-promote a signal by editing this
# file: run the harness and let the measured numbers decide.

signals:
  registry_version: "empty-0.0.0"

  # Fail closed. A signal nobody has measured must not influence a verdict, so
  # the default is `unmeasured`, which is NOT fusion-eligible. (This was
  # previously `bench`; that let an unmeasured signal into fusion, which
  # contradicts both this comment and FAREBI.md §5 rule 5.)
  default_status: unmeasured

  entries: {}
  # Example entry, for shape only:
  # entries:
  #   fft:
  #     status: keep
  #     tier: 1
  #     module: farebi.signals.fft
  #     requires: []
  #     weight: null              # null => weight comes from fitted fusion
  #     cross_source_auc: 0.71
  #     coverage: 0.98
  #     evaluated_on: "2026-09-05"
